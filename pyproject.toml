[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bimanual-teleop"
version = "0.1.0"
description = "Modular Quest, Wuji Glove, Tianji, and Hand2 teleoperation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "numpy>=1.23,<2", "scipy>=1.10,<2", "quadprog==0.1.13", "rich>=14,<15"]

[project.optional-dependencies]
visualization = ["matplotlib>=3.10,<4"]
realsense = ["pyrealsense2==2.58.4.10922", "matplotlib>=3.10,<4"]
wuji = ["wuji-sdk==2026.10.12"]
recording = ["av>=14,<17", "zarr>=2.18,<3", "numcodecs>=0.12,<0.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bimanual_teleop*"]

[tool.setuptools.package-data]
bimanual_teleop = ["py.typed"]
"bimanual_teleop.vendor.tianji" = ["LICENSE", "manifest.json", "README.md", "SDK_PYTHON/*.py", "SDK_PYTHON/*.so", "CommonConfig/*.MvKDCfg"]
