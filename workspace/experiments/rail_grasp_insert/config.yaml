simulation:
  robot:
    ready_deg:
      left: [10, -60, -34, -52, 30, 12, 4]
      # Park the idle right hand above the rail's transfer/rotation volume.
      right: [10, -60, 34, -52, -30, 12, -4]
  rail:
    # Left input bin: robot-facing narrow rim is the X-negative face, along Y.
    # The low end rests inside the box; the high end extends toward the robot.
    # Fitted to the 83 cm rim / 66.5 cm inner floor, retaining reachable grasp poses.
    initial_center: [0.641067253, 0.560, 0.782762627]
    initial_rpy_deg: [0, -26, 180]

task:
  settle_s: 1.0
  settle_timeout_s: 8.0
  stable_linear_speed_m_s: 0.005
  stable_angular_speed_rad_s: 0.04
  stability_filter_s: 0.10
  stage_timeout_s: 45.0
  linear_speed_m_s: 0.04
  angular_speed_rad_s: 0.25
  hand_speed_rad_s: 0.6
  # Experiment-only position gains; URDF effort limits remain unchanged.
  hand_stiffness: [8.0, 8.0, 4.0, 3.2]
  hand_damping: [0.15, 0.15, 0.09, 0.09]
  insertion_speed_m_s: 0.002
  position_tolerance_m: 0.002
  rotation_tolerance_rad: 0.025
  lift_m: 0.02
  lift_hold_s: 1.0
  clearance_z_m: 1.04
  clearance_center_xy_m: [0.57, 0.38]
  transfer_center_m: [0.53, 0.18, 1.00]
  joint_limit_margin_rad: 0.0872665
  max_arm_tracking_error_rad: 0.25
