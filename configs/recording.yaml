# 相机按序列号固定对应；第一台是时间基准，只有它允许采深度。
cameras:
  - "348122072137" # camera_0：主视角 D435
  - "408322070938" # camera_1：D436
  - "408322072104" # camera_2：D436
# 主视角深度；关闭后仍采集三路 RGB。
main_depth: true
# 只限制原始状态落盘频率，不改变设备反馈或控制保护频率。
state_hz: 200
# 每条演示的输出位置；相对路径以启动命令的目录为准。
output_dir: recordings
# 接合成功后再等多久开始或继续本条。0.0 表示一接合就录。
start_delay_s: 0.0

# 正式图像帧池长度（帧）。一条开始时按此长度分配共享内存，并在本条结束前一直占用。
# 三路 RGB 加主视角深度时，每一帧约 3.22 MiB。下面的 256 帧约 825 MiB，30 Hz 下约 8.5 秒。
# 这是按 16 GiB、无交换分区的主机留出的：控制进程和页缓存还要使用其余内存。
# 按主机内存修改这个整数，改完重新启动采集程序：
# - 约 8 GiB：改为 128（约 412 MiB，约 4.3 秒）。
# - 约 16 GiB：保持 256。
# - 32 GiB 及以上：先保持 256。只有日志出现「正式帧池已满」、并且仍有空闲内存时再加大，
#   例如 512（约 1.65 GiB，约 17 秒）。不要加大到开始使用交换分区或挤占控制进程。
# 允许 16 到 2048。16 只有约 0.5 秒，编码稍一落后就会把本条作废。
frame_capacity: 256
# 录制按键。脱离（Enter / Space / 故障 / 回位）只暂停本条，不在这里配置。
controls:
  save_key: s # 保存并结束当前条，遥操作继续
  discard_key: x # 作废并结束当前条
  quit_key: q # 保存当前条并退出
  recover_key: c # 采集进程失败后，先脱离再按此键恢复进程
