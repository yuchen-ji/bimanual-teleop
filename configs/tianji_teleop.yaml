# 天机机械臂与 Quest 遥操作配置；使用 YAML 格式，支持 # 注释。
# 程序使用笛卡尔阻抗控制；profile_id 和固定的 mode 由程序补齐，无需填写。
# 天机控制器的 IPv4 地址，不带端口；--robot-ip（遥操）或 --ip（点动、定位）可临时覆盖。
controller_ip: "192.168.1.190"

# 遥操作终端按键；需让运行程序的终端获得焦点，单次按键立即生效，字母不区分大小写。
controls:
  # 按一次接合，再按一次脱离（暂停）；等待接合、接合中或回位中按下则取消。
  # 接合/脱离键可填 "enter"（回车）或单个英文字母/数字；回位键只支持单个英文字母/数字。
  # 两键不能相同；Q/C/S/X 保留给退出和采集。Space 暂停/取消始终可用。
  # 回车切换仅在遥操作阶段生效；启动前仍用于确认运动。联合模式同步接合/暂停双臂与双手。
  toggle_engagement_key: "enter"
  # 按此键直接回到下方 ready_pose：接合时先停止跟随，再清错回位；完成后保持脱离，无需再按回车。
  ready_pose_key: "h"
  # 手势控制总开关（仅联合模式）；false 关闭所有手势接合、暂停和回位，键盘控制仍可用。
  gesture_engagement_enabled: false

# Quest 手柄的位置和朝向采用哪种参考系。
quest:
  # "headset"：原点跟随头显，水平朝向跟随头显 yaw；"world"：固定的 Quest LOCAL 世界坐标系。
  # coordinate_frame: "world"
  coordinate_frame: "headset"

# 机械臂运动配置；下面的数值是当前本机参数。
profile:
  # 阻抗、负载和运动比例参数；修改负载时填写实际末端工具的辨识结果。
  parameters:
    # 启用的机器人手臂：可填 ["left"]、["right"] 或 ["left", "right"]，不能重复。
    # 遥操命令 --side left/right 会覆盖此选择；left/right 均指机器人侧。
    active_arms: ["left", "right"]

    # 各侧机械臂的独立参数；left 为左臂（SDK A），right 为右臂（SDK B）。
    arms:
      # 左臂参数。原生基座坐标：+X 向前、+Y 向下、+Z 向外。
      left:
        # 依次为 X、Y、Z 平移及 Rx、Ry、Rz 转动刚度；填 6 个非负的 SDK 原生系数，越大越硬。
        stiffness: [900, 900, 900, 90, 90, 90]
        # 阻尼比例；填 6 个 [0, 1] 内的数，方向顺序与 stiffness 相同。
        damping: [0.27, 0.27, 0.27, 0.27, 0.27, 0.27]
        # 零空间姿态保持刚度（N·m/rad），填非负数；控制末端任务之外的冗余关节姿态。
        nullspace_stiffness: 20
        # 零空间阻尼比例，填写 [0, 1] 内的数。
        nullspace_damping: 1
        # 左侧末端工具的 10 项动力学参数，直接填写 SDK 工具辨识输出；空载才填 10 个 0。
        # 来源：left_tool_dynamic_result.yaml，2026-09-21T06:25:20+00:00，arm A；启动阻抗控制前下发并核对回读。
        tool_dyn10:
          - 1.079348013228357  # 质量 m（kg），包含实际安装在法兰上的末端负载。
          - 63.8585653228959  # 质心 x（mm），相对于末端法兰坐标系。
          - 39.662968645620076  # 质心 y（mm），相对于末端法兰坐标系。
          - 166.95336450542584  # 质心 z（mm），相对于末端法兰坐标系。
          - 0.23531511824638673  # 惯量 Ixx（kg·m²），以下按 SDK 输出顺序填写，不重新排序或换算。
          - 0.0  # 惯量 Ixy（kg·m²）。
          - 0.0  # 惯量 Ixz（kg·m²）。
          - 0.00021297103955572605  # 惯量 Iyy（kg·m²）。
          - 0.0  # 惯量 Iyz（kg·m²）。
          - 0.03431637666831784  # 惯量 Izz（kg·m²）。
        # 控制器速度上限比例（%），填 1–100 的整数；不是绝对速度。
        velocity_ratio: 15
        # 控制器加速度上限比例（%），填 1–100 的整数；不是绝对加速度。
        acceleration_ratio: 15

      # 右臂参数。原生基座坐标：+X 向前、+Y 向上、+Z 向外。
      right:
        # 依次为 X、Y、Z 平移及 Rx、Ry、Rz 转动刚度；填 6 个非负的 SDK 原生系数，越大越硬。
        stiffness: [900, 900, 900, 90, 90, 90]
        # 阻尼比例；填 6 个 [0, 1] 内的数，方向顺序与 stiffness 相同。
        damping: [0.27, 0.27, 0.27, 0.27, 0.27, 0.27]
        # 零空间姿态保持刚度（N·m/rad），填非负数；控制末端任务之外的冗余关节姿态。
        nullspace_stiffness: 20
        # 零空间阻尼比例，填写 [0, 1] 内的数。
        nullspace_damping: 1
        # 右侧末端工具的 10 项动力学参数，直接填写 SDK 工具辨识输出；空载才填 10 个 0。
        tool_dyn10:
          - 1.233147594311688  # 质量 m（kg），包含实际安装在法兰上的末端负载。
          - 19.12421273713452  # 质心 x（mm），相对于末端法兰坐标系。
          - 5.423993663934871  # 质心 y（mm），相对于末端法兰坐标系。
          - 105.1292114140725  # 质心 z（mm），相对于末端法兰坐标系。
          - 0.017599121323030802  # 惯量 Ixx（kg·m²），以下按 SDK 输出顺序填写，不重新排序或换算。
          - 0.0  # 惯量 Ixy（kg·m²）。
          - 0.0  # 惯量 Ixz（kg·m²）。
          - 0.001  # 惯量 Iyy（kg·m²）。
          - 0.0  # 惯量 Iyz（kg·m²）。
          - 0.011952536430089627  # 惯量 Izz（kg·m²）。
        # 控制器速度上限比例（%），填 1–100 的整数；不是绝对速度。
        velocity_ratio: 15
        # 控制器加速度上限比例（%），填 1–100 的整数；不是绝对加速度。
        acceleration_ratio: 15

# 初始定位：当前为双臂对称前伸弯肘姿态。这里只配置目标，不会因读取文件而运动。
# 已核对当前目标的关节限位和运动学终点；这些参数不包含现场碰撞路径模型。
ready_pose:
  # 双臂初始定位的执行顺序；["left", "right"] 表示左臂到位后再移动右臂，单侧定位忽略此顺序。
  order: ["left", "right"]
  # 每侧填写 7 个关节角（度），顺序为 J1→J7，正负方向沿用天机 SDK 定义。
  target_deg:
    # 左臂初始目标，依次为 J1、J2、J3、J4、J5、J6、J7（度）。
    left: [30, -60, -34, -52, 30, 12, 4]
    # 右臂初始目标，依次为 J1、J2、J3、J4、J5、J6、J7（度）。
    right: [-30, -60, 34, -52, -30, 12, -4]
  # 仅初始定位期间使用的速度比例（%），填 1–100 的整数，覆盖上面的各臂 velocity_ratio。
  velocity_ratio: 25
  # 仅初始定位期间使用的加速度比例（%），填 1–100 的整数，覆盖上面的各臂 acceleration_ratio。
  acceleration_ratio: 25
