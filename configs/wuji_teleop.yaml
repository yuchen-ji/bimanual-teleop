# Wuji Glove 与 Hand2 配置；使用 YAML 格式，支持 # 注释。
# Hand2 固定使用 MIT 控制；profile_id 和 mode 无需填写，由程序内部维护。
# 填已有标定用户名，例如 "yuchen"；"" 使用 SDK 默认用户，--user-name 可临时覆盖。
sdk_user_name: "huhaoran"

# 以下为当前本机使用的参数值，不代表厂家推荐参数；所有 20 个关节共用这一组参数。
# 参数含义见 https://docs.wuji.tech/docs/zh/wuji-hand/latest/control-guide/。
parameters:
  # MIT 位置误差比例增益，填正数；越大位置跟随越硬，数值直接传给 SDK 的 kp。
  kp: 5.0
  # MIT 速度误差阻尼增益，填正数；数值直接传给 SDK 的 kd。
  kd: 0.05
  # 每个关节的电流上限（A），填正数且不得超过设备允许值；不是整只手的总电流上限。
  current_limit_a: 1.5

# 手部遥操控制循环频率（Hz），填正数；120 表示目标每秒计算并发送 120 次。
# 不改变手套传感器采样率；实际频率取决于运行负载。
control_hz: 120
# Hand2 关节状态与诊断的设备推送频率（Hz）。设备原生为 1000 Hz；遥操作仅需
# 200 Hz，可显著降低四路反馈解码造成的调度压力。实际生效值由设备量化并写入运行日志。
feedback_hz: 200
# 每次接合或恢复后，从当前灵巧手姿态平滑过渡到手套目标的时长（秒），填正数。
transition_s: 0.75
# 手套骨架数据允许的最大帧龄（秒），填正数；超过此值时暂停跟随。
glove_timeout_s: 0.25
# Hand2 关节及诊断反馈允许的最大帧龄（秒），填正数；超过此值时暂停跟随。
hand_timeout_s: 0.5

# 左右两侧的网络设备地址；均填写 "IP:端口"，需要与实际设备设置一致。
devices:
  # 左手套对应左侧 Hand2；与 Quest 的交叉手柄映射无关。
  left:
    # 左手套的 IP 与 SDK 连接端口。
    glove: "192.168.1.100:50001"
    # 左侧 Hand2 的 IP 与 SDK 连接端口。
    hand: "192.168.1.110:7447"
  # 右手套对应右侧 Hand2。
  right:
    # 右手套的 IP 与 SDK 连接端口。
    glove: "192.168.1.101:50001"
    # 右侧 Hand2 的 IP 与 SDK 连接端口。
    hand: "192.168.1.111:7447"
